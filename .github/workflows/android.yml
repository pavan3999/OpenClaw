name: Build OpenClaw Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'OpenClaw/**'
      - 'libwap/**'
      - 'Box2D/**'
      - 'ThirdParty/**'
      - 'CMakeLists.txt'
      - 'Build_Release/config.xml'
      - 'Build_Release/ASSETS.ZIP'
      - 'Build_Release/ORIGINAL_ASSETS.ZIP'

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-23
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.31.6'
  SDL2_VERSION: 'release-2.30.9'
  SDL2_IMAGE_VERSION: 'release-2.8.4'
  SDL2_MIXER_VERSION: 'release-2.8.0'
  SDL2_TTF_VERSION: 'release-2.24.0'

jobs:
  android:
    name: OpenClaw Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      # actions/checkout can initialize LFS, but explicitly pulling here makes
      # the build fail early with a useful error if the LFS object is missing.
      - name: Pull Git LFS files
        run: |
          git lfs install --local
          git lfs pull

          echo '=== Git LFS files ==='
          git lfs ls-files

          echo '=== LFS status ==='
          git lfs status

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify original game resources
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Resource files ==='

          for f in \
            Build_Release/ORIGINAL_ASSETS.ZIP \
            Build_Release/ASSETS.ZIP
          do
            if [ ! -e "$f" ]; then
              echo "::error::$f does not exist"
              exit 1
            fi

            if [ ! -s "$f" ]; then
              echo "::error::$f is empty"
              exit 1
            fi

            echo
            echo "FILE: $f"
            ls -lh "$f"
            file "$f"
            wc -c "$f"
          done

          echo
          echo '=== Check for an unresolved Git LFS pointer ==='

          if grep -aEq '^version https://git-lfs.github.com/spec/v1$' \
              Build_Release/ORIGINAL_ASSETS.ZIP; then
            echo "::error::ORIGINAL_ASSETS.ZIP is still a Git LFS pointer."
            echo "The actual LFS object was not downloaded."
            exit 1
          fi

          if grep -aEq '^version https://git-lfs.github.com/spec/v1$' \
              Build_Release/ASSETS.ZIP; then
            echo "::error::ASSETS.ZIP is still a Git LFS pointer."
            exit 1
          fi

          echo
          echo '=== Test ORIGINAL_ASSETS.ZIP ==='
          unzip -t Build_Release/ORIGINAL_ASSETS.ZIP

          echo
          echo '=== Test ASSETS.ZIP ==='
          unzip -t Build_Release/ASSETS.ZIP

          echo
          echo '=== Original resource ZIP ==='
          unzip -l Build_Release/ORIGINAL_ASSETS.ZIP | head -25

          echo
          echo '=== OpenClaw custom resource ZIP ==='
          unzip -l Build_Release/ASSETS.ZIP | head -25

      - name: Download SDL2
        run: |
          git clone --depth 1 --branch "${SDL2_VERSION}" \
            https://github.com/libsdl-org/SDL.git third_party/SDL2

      - name: Download SDL2_image
        run: |
          git clone --depth 1 --branch "${SDL2_IMAGE_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_image.git third_party/SDL2_image

      - name: Download SDL2_mixer
        run: |
          git clone --depth 1 --branch "${SDL2_MIXER_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_mixer.git third_party/SDL2_mixer

      - name: Download SDL2_ttf
        run: |
          git clone --depth 1 --branch "${SDL2_TTF_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_ttf.git third_party/SDL2_ttf

      - name: Download SDL2_gfx
        run: |
          git clone --depth 1 \
            https://github.com/ferzkopp/SDL2_gfx.git third_party/SDL2_gfx

      - name: Create Android application
        run: |
          mkdir -p android-app/app/src/main/java/com/pavan3999/openclaw
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/cpp

          mkdir -p android-app/app/src/main/java/org/libsdl/app

          cp third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java \
             android-app/app/src/main/java/org/libsdl/app/SDLActivity.java

          for f in SDLAudioManager.java SDLControllerManager.java; do
            if [ -f "third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/$f" ]; then
              cp "third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/$f" \
                 "android-app/app/src/main/java/org/libsdl/app/$f"
            fi
          done

          cp Build_Release/ORIGINAL_ASSETS.ZIP android-app/app/src/main/assets/
          cp Build_Release/ASSETS.ZIP android-app/app/src/main/assets/
          cp Build_Release/config.xml android-app/app/src/main/assets/

          for f in SAVES.XML clacon.ttf console02.tga startup_commands.txt; do
            if [ -f "Build_Release/$f" ]; then
              cp "Build_Release/$f" "android-app/app/src/main/assets/$f"
            fi
          done

      - name: Create Android Activity
        run: |
          cat > android-app/app/src/main/java/com/pavan3999/openclaw/OpenClawActivity.java <<'EOF'
          package com.pavan3999.openclaw;

          import android.os.Bundle;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          import org.libsdl.app.SDLActivity;

          public class OpenClawActivity extends SDLActivity {
              private static final String[] ASSETS = {
                  "ORIGINAL_ASSETS.ZIP",
                  "ASSETS.ZIP",
                  "config.xml",
                  "SAVES.XML",
                  "clacon.ttf",
                  "console02.tga",
                  "startup_commands.txt"
              };

              @Override
              protected String[] getLibraries() {
                  return new String[] { "SDL2", "openclaw" };
              }

              @Override
              protected String getMainFunction() {
                  return "OpenClawMain";
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  copyGameFiles();
                  super.onCreate(savedInstanceState);
              }

              private void copyGameFiles() {
                  for (String name : ASSETS) {
                      try {
                          InputStream in = getAssets().open(name);
                          File dst = new File(getFilesDir(), name);

                          if (dst.exists() && dst.length() > 0) {
                              in.close();
                              continue;
                          }

                          try (InputStream input = in;
                               FileOutputStream output = new FileOutputStream(dst)) {
                              byte[] buffer = new byte[1024 * 1024];
                              int n;
                              while ((n = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, n);
                              }
                              output.flush();
                          }
                      } catch (IOException e) {
                          throw new RuntimeException("Failed to copy " + name, e);
                      }
                  }
              }
          }
          EOF

      - name: Create Android manifest
        run: |
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.pavan3999.openclaw.OpenClawActivity"
                      android:configChanges="layoutDirection|locale|orientation|uiMode|screenLayout|screenSize|smallestScreenSize|keyboard|keyboardHidden|navigation"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">OpenClaw</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Create Android CMake project
        run: |
          cat > android-app/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(OpenClawAndroid LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 11)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          # Use the modern SDL headers before the old repository headers.
          include_directories(BEFORE
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2/include
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_image/include
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_mixer/include
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_ttf/include
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../
          )

          # SDL2
          set(SDL_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_STATIC OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL_INSTALL_TESTS OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2
              SDL2-build
          )

          # SDL2_image
          set(SDL2IMAGE_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2IMAGE_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL2IMAGE_VENDORED ON CACHE BOOL "" FORCE)

          add_subdirectory(
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_image
              SDL2_image-build
          )

          # SDL2_mixer
          set(SDL2MIXER_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_CMD OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_VENDORED ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_TIMIDITY ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_FLUIDSYNTH OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_NATIVE OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_mixer
              SDL2_mixer-build
          )

          # SDL2_ttf
          set(SDL2TTF_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2TTF_VENDORED ON CACHE BOOL "" FORCE)

          add_subdirectory(
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_ttf
              SDL2_ttf-build
          )

          # SDL2_gfx primitives
          add_library(SDL2_gfx STATIC
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx/SDL2_gfxPrimitives.c
          )

          target_include_directories(SDL2_gfx PUBLIC
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx
          )

          target_link_libraries(SDL2_gfx PRIVATE SDL2)

          # OpenClaw
          add_subdirectory(
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../
              OpenClaw-build
          )

          target_link_libraries(openclaw PRIVATE SDL2_gfx)
          EOF

      - name: Verify source Android entry point
        run: |
          set -e
          grep -n "OpenClawMain" OpenClaw/main.cpp
          grep -n "ORIGINAL_ASSETS.ZIP" Build_Release/config.xml

      - name: Create Gradle project
        run: |
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'OpenClawAndroid'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pavan3999.openclaw'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pavan3999.openclaw'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }

                  externalNativeBuild {
                      cmake {
                          arguments '-DANDROID_STL=c++_shared'
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.31.6'
                  }
              }

              ndkVersion '27.2.12479018'

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          APK=$(find android-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" OpenClaw-Android-debug.apk
          ls -lh OpenClaw-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android-debug
          path: OpenClaw-Android-debug.apk
          if-no-files-found: error
