name: Build OpenClaw Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'OpenClaw/**'
      - 'libwap/**'
      - 'Box2D/**'
      - 'ThirdParty/**'
      - 'CMakeLists.txt'
      - 'Build_Release/config.xml'
      - 'Build_Release/ASSETS.ZIP'
      - 'Build_Release/ORIGINAL_ASSETS.ZIP'

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-23
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.31.6'
  SDL2_VERSION: 'release-2.30.9'
  SDL2_IMAGE_VERSION: 'release-2.8.4'
  SDL2_MIXER_VERSION: 'release-2.8.0'
  SDL2_TTF_VERSION: 'release-2.24.0'

jobs:
  android:
    name: OpenClaw Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify original game resources
        run: |
          test -s Build_Release/ORIGINAL_ASSETS.ZIP || {
            echo '::error::Build_Release/ORIGINAL_ASSETS.ZIP is missing.'
            echo 'It must contain the CONTENTS of the original Captain Claw Assets directory at the ZIP root.'
            exit 1
          }

          test -s Build_Release/ASSETS.ZIP || {
            echo '::error::Build_Release/ASSETS.ZIP is missing.'
            exit 1
          }

          unzip -t Build_Release/ORIGINAL_ASSETS.ZIP >/dev/null
          unzip -t Build_Release/ASSETS.ZIP >/dev/null

          echo 'Original resource ZIP:'
          ls -lh Build_Release/ORIGINAL_ASSETS.ZIP
          echo 'OpenClaw custom resource ZIP:'
          ls -lh Build_Release/ASSETS.ZIP

          echo 'First original resources:'
          unzip -l Build_Release/ORIGINAL_ASSETS.ZIP | head -25

      - name: Download SDL2
        run: |
          git clone --depth 1 --branch "${SDL2_VERSION}" \
            https://github.com/libsdl-org/SDL.git third_party/SDL2

      - name: Download SDL2_image
        run: |
          git clone --depth 1 --branch "${SDL2_IMAGE_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_image.git third_party/SDL2_image

      - name: Download SDL2_mixer
        run: |
          git clone --depth 1 --branch "${SDL2_MIXER_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_mixer.git third_party/SDL2_mixer

      - name: Download SDL2_ttf
        run: |
          git clone --depth 1 --branch "${SDL2_TTF_VERSION}" --recurse-submodules \
            https://github.com/libsdl-org/SDL_ttf.git third_party/SDL2_ttf

      - name: Download SDL2_gfx
        run: |
          git clone --depth 1 \
            https://github.com/ferzkopp/SDL2_gfx.git third_party/SDL2_gfx

      - name: Create Android application
        run: |
          mkdir -p android-app/app/src/main/java/com/pavan3999/openclaw
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/cpp

          # SDLActivity Java support.
          mkdir -p android-app/app/src/main/java/org/libsdl/app
          cp third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java \
             android-app/app/src/main/java/org/libsdl/app/SDLActivity.java

          if [ -f third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLAudioManager.java ]; then
            cp third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLAudioManager.java \
               android-app/app/src/main/java/org/libsdl/app/SDLAudioManager.java
          fi

          if [ -f third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLControllerManager.java ]; then
            cp third_party/SDL2/android-project/app/src/main/java/org/libsdl/app/SDLControllerManager.java \
               android-app/app/src/main/java/org/libsdl/app/SDLControllerManager.java
          fi

          cp Build_Release/ORIGINAL_ASSETS.ZIP android-app/app/src/main/assets/ORIGINAL_ASSETS.ZIP
          cp Build_Release/ASSETS.ZIP          android-app/app/src/main/assets/ASSETS.ZIP
          cp Build_Release/config.xml          android-app/app/src/main/assets/config.xml
          cp Build_Release/SAVES.XML           android-app/app/src/main/assets/SAVES.XML
          cp Build_Release/clacon.ttf          android-app/app/src/main/assets/clacon.ttf
          cp Build_Release/console02.tga       android-app/app/src/main/assets/console02.tga
          cp Build_Release/startup_commands.txt android-app/app/src/main/assets/startup_commands.txt

      - name: Create Android Activity
        run: |
          cat > android-app/app/src/main/java/com/pavan3999/openclaw/OpenClawActivity.java <<'EOF'
          package com.pavan3999.openclaw;

          import android.os.Bundle;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          import org.libsdl.app.SDLActivity;

          public class OpenClawActivity extends SDLActivity {
              private static final String[] ASSETS = {
                  "ORIGINAL_ASSETS.ZIP",
                  "ASSETS.ZIP",
                  "config.xml",
                  "SAVES.XML",
                  "clacon.ttf",
                  "console02.tga",
                  "startup_commands.txt"
              };

              @Override
              protected String[] getLibraries() {
                  return new String[] { "SDL2", "openclaw" };
              }

              @Override
              protected String getMainFunction() {
                  return "OpenClawMain";
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  copyGameFiles();
                  super.onCreate(savedInstanceState);
              }

              private void copyGameFiles() {
                  for (String name : ASSETS) {
                      File dst = new File(getFilesDir(), name);
                      if (dst.exists() && dst.length() > 0) {
                          continue;
                      }

                      try (InputStream in = getAssets().open(name);
                           FileOutputStream out = new FileOutputStream(dst)) {
                          byte[] buffer = new byte[1024 * 1024];
                          int n;
                          while ((n = in.read(buffer)) != -1) {
                              out.write(buffer, 0, n);
                          }
                          out.flush();
                      } catch (IOException e) {
                          throw new RuntimeException("Failed to copy " + name, e);
                      }
                  }
              }
          }
          EOF

      - name: Create Android manifest
        run: |
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="OpenClaw"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.pavan3999.openclaw.OpenClawActivity"
                      android:configChanges="layoutDirection|locale|orientation|uiMode|screenLayout|screenSize|smallestScreenSize|keyboard|keyboardHidden|navigation"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">OpenClaw</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Create Android CMake project
        run: |
          cat > android-app/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(OpenClawAndroid LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 11)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          # The repository contains very old SDL headers under ThirdParty/SDL2.
          # Use the modern Android SDL headers instead.
          file(REMOVE_RECURSE ${CMAKE_CURRENT_LIST_DIR}/../../../../../ThirdParty/SDL2)
          file(MAKE_DIRECTORY ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)
          file(COPY ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2/include/
               DESTINATION ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)
          file(COPY ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_image/include/
               DESTINATION ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)
          file(COPY ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_mixer/include/
               DESTINATION ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)
          file(COPY ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_ttf/include/
               DESTINATION ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)
          file(COPY ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx/SDL2_gfxPrimitives.h
               DESTINATION ${CMAKE_CURRENT_LIST_DIR}/../../../../../SDL2)

          include_directories(BEFORE ${CMAKE_CURRENT_LIST_DIR}/../../../../../)

          # SDL2
          set(SDL_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_STATIC OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL_INSTALL_TESTS OFF CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2 SDL2-build)

          # SDL2_image
          set(SDL2IMAGE_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2IMAGE_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL2IMAGE_VENDORED ON CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_image SDL2_image-build)

          # SDL2_mixer. Timidity is kept enabled for XMI->MIDI playback.
          set(SDL2MIXER_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_CMD OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_VENDORED ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_TIMIDITY ON CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_FLUIDSYNTH OFF CACHE BOOL "" FORCE)
          set(SDL2MIXER_MIDI_NATIVE OFF CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_mixer SDL2_mixer-build)

          # SDL2_ttf
          set(SDL2TTF_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL2TTF_VENDORED ON CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_ttf SDL2_ttf-build)

          # SDL2_gfx: OpenClaw uses polygonRGBA/circleRGBA from the primitives
          # implementation. Build the complete primitives translation unit.
          add_library(SDL2_gfx STATIC
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx/SDL2_gfxPrimitives.c
          )
          target_include_directories(SDL2_gfx PUBLIC
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../third_party/SDL2_gfx
          )
          target_link_libraries(SDL2_gfx PRIVATE SDL2)

          # OpenClaw root. It links SDL2, SDL2_image, SDL2_mixer, SDL2_ttf,
          # SDL2_gfx and Android system libraries.
          add_subdirectory(${CMAKE_CURRENT_LIST_DIR}/../../../../../ OpenClaw-build)

          target_link_libraries(openclaw PRIVATE SDL2_gfx)
          EOF

      - name: Verify source Android entry point
        run: |
          grep -n "OpenClawMain" OpenClaw/main.cpp
          grep -n "ORIGINAL_ASSETS.ZIP" Build_Release/config.xml

      - name: Create Gradle project
        run: |
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'OpenClawAndroid'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pavan3999.openclaw'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pavan3999.openclaw'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }

                  externalNativeBuild {
                      cmake {
                          arguments '-DANDROID_STL=c++_shared'
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.31.6'
                  }
              }

              ndkVersion '27.2.12479018'

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          APK=$(find android-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" OpenClaw-Android-arm64-v8a-debug.apk
          ls -lh OpenClaw-Android-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android-arm64-v8a-debug
          path: OpenClaw-Android-arm64-v8a-debug.apk
          if-no-files-found: error
